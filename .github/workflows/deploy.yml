# Deploys the site to GitHub Pages (https://joeyoosenbrug.nl) when a pull request is merged into main.
# Merging a PR is a push to main, so this is the trigger that fires on merge. (A pull_request trigger
# can't deploy: the github-pages environment only accepts deployments from main.)
# Work on a feature branch and open a PR; nothing goes live until that PR is merged.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions", Custom domain: joeyoosenbrug.nl.
# It also rebuilds every Monday, so pull request states from GitHub and the "now" status in the hero stay current.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # manual re-deploy from the Actions tab
  workflow_dispatch:
  # weekly refresh (Monday 06:00 UTC)
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run check

      - run: npm run test:unit

      # prebuild fetches the live pull request states; the token raises the API rate limit
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
