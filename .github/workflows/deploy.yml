# Deploys the site to GitHub Pages (https://joeyoosenbrug.nl) when a pull request is merged into main.
# Merging a PR is a push to main, so this is the trigger that fires on merge. (A pull_request trigger
# can't deploy: the github-pages environment only accepts deployments from main.)
# Work on a feature branch and open a PR; nothing goes live until that PR is merged.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions", Custom domain: joeyoosenbrug.nl.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # manual re-deploy from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run check

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
