# Weekly dependency updates, grouped so there is one PR per ecosystem instead of one per package.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    ignore:
      # SvelteKit, svelte-check and typescript-eslint only support TypeScript up to 6.
      # Remove this once their peer ranges include 7.
      - dependency-name: typescript
        versions: ['>=7']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
